<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terraria 2D Canvas Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="1000" height="600"></canvas>

        <div id="hud">
            <div id="stats-panel">
                <div class="hud-row">
                    <span class="hud-label">NÍVEL: <strong id="level-display">1</strong></span>
                    <span class="hud-label">XP: <span id="xp-text">0/100</span></span>
                </div>
                
                <div class="bar-container">
                    <div id="hp-bar" class="bar hp-fill" style="width: 100%;"></div>
                    <span id="hp-text" class="bar-text">100 / 100</span>
                </div>

                <div class="bar-container">
                    <div id="xp-bar" class="bar xp-fill" style="width: 0%;"></div>
                </div>

                <div id="attributes-display">
                    <span>ATQ: <strong id="atq-val">10</strong></span> | 
                    <span>DEF: <strong id="def-val">2</strong></span>
                </div>
            </div>

            <div id="hotbar">
                <div class="slot active" data-slot="1"><span class="slot-key">1</span> Pickaxe</div>
                <div class="slot" data-slot="2"><span class="slot-key">2</span> Sword</div>
                <div class="slot" data-slot="3"><span class="slot-key">3</span> Dirt</div>
                <div class="slot" data-slot="4"><span class="slot-key">4</span> Stone</div>
                <div class="slot" data-slot="5"><span class="slot-key">5</span> Wood</div>
            </div>
        </div>

        <div id="level-popup" class="hidden">LEVEL UP!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
