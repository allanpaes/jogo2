<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terraria Clone JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="hud">
            <div class="stats-panel">
                <div class="bar-container">
                    <span>HP: <span id="hp-text">100/100</span></span>
                    <div id="hp-bar" class="bar hp"></div>
                </div>
                <div class="bar-container">
                    <span>XP: <span id="xp-text">0/100</span> (Nível <span id="level-text">1</span>)</span>
                    <div id="xp-bar" class="bar xp"></div>
                </div>
            </div>

            <div id="inventory">
                <div class="slot active" data-block="1">Terra (1)</div>
                <div class="slot" data-block="2">Pedra (2)</div>
                <div class="slot" data-block="3">Madeira (3)</div>
            </div>

            <div id="stats-menu">
                <h3>Atributos (Pontos: <span id="stat-points">0</span>)</h3>
                <button onclick="upgradeStat('hp')">+ Vida</button>
                <button onclick="upgradeStat('damage')">+ Dano</button>
                <button onclick="upgradeStat('speed')">+ Velocidade</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
